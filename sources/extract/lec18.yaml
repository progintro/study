issues:
  - "Chapter is ~815 lines, above the 350-550 target: 63 slides with ~12 complete programs and terminal outputs. The sorting part is already condensed and points to chapter 17 for full programs/traces."
  - "Sorting slides (p. 6-21) repeat lecture 17 (chapter 17 covers the same code in detail). The swap (p. 7-8) and Instagram (p. 5) questions were NOT written as lec18 files because slides-lec17-swap, slides-lec16-swap and slides-lec17-instagram already exist; the coordinator may want to add lecture 18 to their sources."
  - "p. 6 lists Bubblesort first, but the slides present selection (p. 9), insertion (p. 11), bubble (p. 13); the chapter follows the presentation order."
  - "p. 30: the shown run says 'Gimme two numbers: 3.0 4.0' / 'Result: 5.0', but the code prints 'Gimme two doubles: ' and 'Hypotenuse: %.1f'; the chapter's transcript follows the code."
  - "p. 34: overflow output shows 'Houston,' then 'Segmentation fault' (undefined behaviour; the exact symptom varies, e.g. stack smashing detected)."
  - "p. 37: slide title says '%ms since C11'; the m modifier is actually a POSIX.1-2008 / glibc extension, not ISO C11. The chapter says so."
  - "p. 40: code prints 'Size of FILE type: %zu' but the shown output is just '216'; the chapter only states the value 216 (Debian)."
  - "p. 43-46: the open/close example returns 1 when the second fopen fails without closing the first file; the chapter's version adds fclose(fileToRead) and says so."
  - "p. 48, 50: slides print size_t with %d; the chapter uses %zu and lists it under Συχνά λάθη; the fread-int question file keeps %d as on the slide."
  - "p. 48-49: slide declares an unused fileToWrite; dropped in the chapter's program. The printed string contains the file's trailing newline, so the output has an extra blank line (not shown on the slide; kept in the chapter's transcript)."
  - "p. 50-51: the int example is shown in the chapter as a 4-line fragment (the rest is identical to p. 48)."
  - "p. 55: fileno snippet has no main on the slide; kept as a fragment."
  - "p. 59-60: fscanf/fprintf example has '// ...' where fopen checks and fclose would be; the chapter's program adds the NULL check and fclose."
  - "p. 62: 'σελίδες 136-151, 160-177' of the notes: K04 p. 136 is the end of 08-lists-trees and p. 160 the end of 10-preprocessor; the chapter cites 09-io p. 137-152 and 11-sorting-searching p. 161-178 by section."
  - "Chapter additions not on the slides: the quicksort/merge sort trace on {5,2,4,6,1,3} (produced by running the slide code), the fopen mode table (from the man page on p. 42), and the descriptions of fgets/feof/fseek/fgetc/fputc (p. 61 lists only the prototypes; descriptions from notes 09-io)."
  - "p. 24-25: terminal screenshots (./grade 80 100 90 -> 'My grade is: 88'; ./aliquot session) are only referred to briefly; they were covered in lecture 9."
