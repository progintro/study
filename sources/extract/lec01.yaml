issues:
  - "p. 42 cites Stamatopoulos' notes 'σελίδες 58-60, 98-99'. These are the page numbers printed on K04.pdf, which k04-map.tsv now uses: 58-60 = 04-functions «Δομή ενός προγράμματος C – Συναρτήσεις» (main, return value to the OS) and 98-99 = 06-memory-strings «Ορίσματα γραμμής εντολών». The chapter cites K04 58-60 and 98-99."
  - "No explicit key-takeaways slide; Κύρια σημεία are synthesised from the definition slides (9, 14, 27, 32, 35-40)."
  - "p. 41 is only 'Kahoot Time!'; the quiz questions are not in the slides, none transcribed."
  - "pp. 20-24 (DevOps story: CloudWatch alert, maps zooming to a data center, 'ssh is the remote control', volunteer demo 'ssh ubuntu@...' with a demo password) are mostly images; kept the point in words. The demo host is elided in the slide and the demo password was deliberately not copied into the chapter."
  - "p. 25 shows `uname -a` output starting with lowercase 'linux linux14 ...'; transcribed as on the slide (real uname prints the kernel name 'Linux')."
  - "p. 29-30: the hello.c shown by `cat` has no `return 0;` (62 bytes), while pp. 33-40 show helloworld.c with `return 0;`. p. 34 compiles hello.c although p. 33's comment names the file helloworld.c. Kept both as on the slides."
  - "p. 25 lists `last` output as '…' and `top`, `man`, `ps` without output (interactive); the chapter's one-line descriptions of these commands are standard Unix knowledge, not slide text."
  - "p. 16 ('Ας τρέξουμε το πρόγραμμα /bin/echo') shows no output; the chapter shows the standard output 'hello good world'. The `echo $?` example (0, and 1 after `return 1;`) is derived from p. 39's text, not a slide transcript."
  - "p. 11 calls CLI also Terminal/Console/Shell and links an article on their differences; the chapter does not detail those differences beyond the kernel/shell distinction of p. 13."
  - "Relative/absolute paths, '~' and case sensitivity are not defined on the slides (they appear implicitly in pp. 28-30 prompts and `cp ../hello.c .`); definitions follow lab01's introduction."
  - "Common-mistake compiler/shell messages (command not found, Directory not empty, expected ';' before 'return') are standard gcc/bash/coreutils wording, not verified locally (local gcc is clang)."
  - "Lab mapping: lab00 steps 4-5, 7 and lab01 steps 1-3, 5 practise this lecture; lab01 step 4 (permissions) and step 6 / info.txt (git) go beyond it (git is chapter 4)."
