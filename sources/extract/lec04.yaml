issues:
  - "2026-27 deck vs 2025-26 (44 pages): the title drops 'Live Coding'; pair programming (2025 pp. 5-7) moved to lecture 3 (2026 pp. 38-40); the grade program with argc/argv/atoi (2025 pp. 8-10) and the bitwise questions (2025 pp. 29-30, slides-lec04-msb and slides-lec04-cafebeef) were removed; the clone example is now hw0-2026-barbouni-2005 and points to Φυλλάδιο 0. Page mapping: 2025 pp. 1-4 = 2026 pp. 1-4, 2025 pp. 11-28 = 2026 pp. 5-22, 2025 pp. 31-44 = 2026 pp. 23-36. The chapter keeps the removed material; the four questions from removed slides cite the 2025-26 deck. Page numbers in the issues below are 2025-26."
  - "No explicit key-takeaways slide; the red callouts (p. 20 'Don't forget to add your files', p. 27 zero = false, p. 32 truncation not rounding, p. 40 use parentheses) were treated as takeaways."
  - "p. 2 announces that 'η Εργασία' (hw0) comes out that day; not a concept, omitted. p. 3 recap and p. 4 agenda are not separate sections."
  - "p. 7 (volunteers) and p. 8-9 are live coding; the grade program on p. 9/38 is 'μια περσινή λύση'. Its terminal output (79, usage message) was produced by compiling it locally, not transcribed from the slides."
  - "p. 8 asks to express a 'Κανόνας Αναπροσαρμογής' (homework capped at final_exam + 3); the slides give no solution, so the chapter leaves it as an exercise (slides-lec04-grade-adjustment)."
  - "Audience questions on pp. 21, 25, 26, 27, 28, 31 ('Τι τύπου τελεστές είναι;', 'τι τύπο θα είχαν αν ήταν συναρτήσεις;') are answered in the chapter from standard C, not from the slides."
  - "p. 28: the ~ examples (~0xF0 -> 0x0F, ~0x05 -> 0xFA) hold for 8 bits only; on a 32-bit int the result is 0xFFFFFF0F / 0xFFFFFFFA (verified locally). The chapter keeps the slide values with '(σε 8 bit)' and explains."
  - "p. 33: the implicit conversion hierarchy is an image (from GeeksforGeeks) listing bool, char, short int, int, unsigned int, long, unsigned, long long, float, double, long double; 'unsigned' after 'long' is kept as shown (presumably unsigned long). The real C rules (integer promotions, usual arithmetic conversions) are more nuanced; not expanded."
  - "p. 41: the precedence table is an image; transcribed as a Markdown table. sizeof is highlighted in red on the slide, no explanation given."
  - "p. 42 is only 'Kahoot Time!'; the quiz questions are not in the slides, so none were transcribed."
  - "p. 43 says to cover the notes 'μέχρι την σελίδα 43'; per k04-map.tsv K04 p. 43 is 02-types-operators «Εντολές αντικατάστασης, τελεστές και παραστάσεις» (pp. 34-43), its last page."
  - "p. 13 '~90% των χρηστών/project' is transcribed as is; no source is given on the slide."
  - "The gcc -Wall warning text for 'if (x = 42)' in «Συχνά λάθη» comes from knowledge of gcc, not verified locally (local gcc is clang). The git error messages (Permission denied (publickey), rejected fetch first) come from faq.md #96 and #106."
  - "The comma pitfall (x = 12, 42 assigns 12) and (int)-42.67 == -42 are standard C, verified locally, not from the slides."
