issues:
  - "The PDF has only 10 pages and almost no technical content: announcements (p. 2), last time / today (pp. 3-4), 'Τι ελέγχει το διαγώνισμα;' (p. 5), the syllabus list (p. 6), the list of problem types (p. 7), then 'Live Session' (p. 8) and closing slides (pp. 9-10). The Θεωρία sections on each problem type (code reading, linear pass, greedy, memoization/DP, sorting and binary search as prerequisites, recursion) are the chapter's explanations of the slide's one-line bullets, built from course material (chapter 16 on memoization/Fibonacci, notes 11-sorting-searching, notes 08-lists-trees, lab05 fib.c / ladder.c, and the past exams and their question-bank hints); they are not transcribed from slides."
  - "p. 4 says the problem solving part was on 'Περσινά θέματα' and p. 8 is only 'Live Session'. Which past problems were solved live is not recorded. The chapter's examples (puzzle trace, longest run, coins greedy vs DP, tree height / free_tree) are the chapter's own illustrative programs, compiled and run; the table of past exam problems by type (Jan 2025, Sep 2025, Jul/Sep/Dec 2024) is the guide's classification, not the slides'."
  - "The Valgrind guest lecture (G. Spyrou) is not in the PDF. The Valgrind section follows the lab09 appendix «Παράρτημα: Αποσφαλμάτωση προγραμμάτων (Πράξη 5η)», which states it is based on Spyrou's 'Memory Management with Valgrind' presentation. No valgrind output in the chapter was produced by us (valgrind not available locally); the claim that omitting free_tree gives 1 definitely lost + 6 indirectly lost blocks is by analogy with the lab09 list example, not a recorded run."
  - "The complexity-in-every-question observation (e.g. 6/20, 8/25 points) comes from the Jan 2025 exam PDF and the question bank, not from the slides."
  - "No questions, quizzes or exercises in the slides (p. 5's 'Τι ελέγχει το διαγώνισμα;' is a section title answered on p. 6-7); no slides-lec25-* question files written."
  - "Past-exam question files for Jan 2025 (exam-2025-jan-*) did not exist in questions/exams/ at writing time; the chapter links the exam PDFs directly."
