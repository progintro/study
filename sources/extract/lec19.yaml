issues:
  - "p. 2: announcements (tutorial session in Linux Lab Tue 9 Dec 9-11pm, no office hours that day) are course logistics; not put in the chapter."
  - "p. 4: 'Σήμερα' lists «Επίλυση Προβλημάτων», but no problem-solving slides follow in this PDF (deck ends at p. 47 after pointers to structs)."
  - "p. 17-21: the memory diagram places grade at byte 31260 right after year (no padding), total 268. This matches gcc -m32 (p. 21 output 268); on x86-64/arm64 sizeof(struct student) is 272 with grade at offset 264. The chapter states both."
  - "p. 39: sizeof(prod) = 40 is the 64-bit value (8-byte char *); the slide shows no -m32 flag here. With -m32 it would be 36. Chapter says 40 with the 64-bit breakdown."
  - "p. 35-37: the typedef'd student uses `int year` but printf still uses %u; harmless but a format mismatch. The chapter keeps `unsigned int` in compiled examples."
  - "p. 12-13: the program on the slide omits #include lines and the struct definition; the chapter adds <stdio.h>, <string.h> and the struct so it compiles."
  - "p. 30: the first line of output (-29387249 0) is uninitialized garbage and varies per run; transcribed as on the slide."
  - "p. 42-45: the program never frees d3 or checks malloc for NULL; the chapter notes this and links chapter 13."
  - "p. 46: the lecture cites notes pages 109-119 and 126. k04-map.tsv (printed pages) maps 109-116 to «Δομές», 117-119 to «Εύρεση τριγώνων…» and 126 to «Δημιουργία νέων ονομάτων τύπων»; «Απαριθμήσεις» (108) is not cited. The chapter uses these pages."
  - "Chapter adds from the notes / standard C, not stated on the slides: designated initializers (only linked on p. 46), declaring variables together with the type, why *p.x needs parentheses (precedence of . over *), and `.` left associativity. Compiler error messages in «Συχνά λάθη» were checked with gcc 14."
  - "Question files: slides-lec19-many-students merges the rhetorical questions of p. 6 and p. 7; slides-lec19-sizeof-student merges p. 20-21 with the «Συνοψίζοντας» question on p. 28."
