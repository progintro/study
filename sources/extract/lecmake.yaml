issues:
  - "Link pages (21, 34, 36, 39) confirmed with pdftohtml -xml (which also printed an xref warning); on p. 34 and 36 the links sit on the Greek terms (lazy/eager, automatic variables)."
  - "p. 10 vs p. 31: p. 10 repeats the typedef and prototype in both files, p. 31 suddenly has a primes.h prerequisite; the chapter says primes.h now holds them. Function bodies are elided on the slides ('// …'), so the chapter shows them as skeletons (skipped by check-code)."
  - "p. 13: a chat meme of escalating flag requests ending in 'και να μην έχει frame pointer' / 'Παράτα μας'; kept only the point (long commands), the frame-pointer flag is not named on the slide."
  - "p. 26: the slide says indentation must be 'consistent'; in GNU Make recipe lines must start with a tab (as lab10 says). The chapter states the tab rule."
  - "p. 27: 'Makefile (ή καμιά 5 άλλα πιθανά ονόματα)' - the chapter says 'λίγα άλλα ονόματα, όπως makefile' rather than listing them."
  - "p. 28: the slide does not define 'out of date'; the chapter adds the standard modification-time rule (target missing or older than a prerequisite)."
  - "p. 32-39: the slides describe macros, automatic variables, wildcard and built-in rules but never show the resulting Makefiles. The chapter's two Makefiles (macros + $@/$^/$< + %.o rule, and the 3-line built-in-rules version with a target-specific 'main.o: CFLAGS += -std=c99') are constructed and were verified with make on a test copy of the project; output lines are from that run (built-in rule output uses 'cc')."
  - "p. 33 mentions assignment 'μέσα σε ένα rule, όπως θα δούμε σύντομα' but no later slide shows it; the chapter illustrates it with the target-specific CFLAGS example."
  - "p. 11: pdftotext rendered '--dynamic-linker' as '.-dynamic-linker'; read visually as '--dynamic-linker'. Slide code uses curly quotes in printf(“%.2f\\n”); normalised to straight quotes."
  - "Session transcript in «Το πρώτο Makefile» uses GNU Make 4 message style ('main' is up to date); verified on GNU Make 3.81 whose quoting differs (`main')."
  - "The slides have no explicit exercise; 5 slide questions were written from the audience questions (p. 5, 6-8, 14, 18-20) and the implied challenge 'Μπορούμε να κάνουμε το Makefile μας, 2-3 γραμμές' (p. 39)."
