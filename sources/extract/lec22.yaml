issues:
  - "p. 2: announcement 'Η εργασία #2 βγήκε την Παρασκευή - προθεσμία 10 Ιανουαρίου 23:59' (course policy, not put in the chapter)."
  - "p. 3-4: xkcd comic (Christmas tree with a heap of presents) is a joke only; not described in the chapter."
  - "The tree part of lec21.pdf (lists and trees) overlaps heavily with these slides (same is_empty/depth/traversal/BFS code); the chapter covers it fully here and chapter 21 may repeat part of it."
  - "p. 9: the slide defines node level as 'the number of nodes that intervene up to the root', but the picture puts the root at Level 1; the chapter follows the picture (level = nodes on the path from the root, inclusive)."
  - "p. 6-7: depth (root to leaves) and height (leaves to root) are both defined for the whole tree and both equal 2; the slides do not define per-node depth/height, and the chapter does not either."
  - "p. 18, 30, 36: blank title-only slides (question posed, answer on the next slide)."
  - "p. 33-34: bfs uses insert/pop_last on a List of Tree, but the slides never define them; the chapter's complete BFS program supplies its own insert (at the head, as in lec21) and pop_last (walks to the tail). Output 5 7 1 2 9 was obtained by compiling it, not from the slides. The slides' O(n) time implies an O(1) pop_last (e.g. a tail pointer); noted in the chapter."
  - "p. 20, 28, 31, 34, 37: complexities are stated for a perfect/balanced tree; the chapter adds that a degenerate tree/BST makes space (and BST search) O(n), which the slides do not state."
  - "p. 29, 38-41: questions to the audience with no answer on the slides; the chapter's answers (post-order for the evaluator, BFS for the shortest path, DFS for less memory when visiting all nodes) are standard and agree with the course FAQ (faq2.md #118-120)."
  - "p. 16: insert and delete are left as exercises ('μόνοι σας'); written as question files for a BST, since the slides do not say which kind of tree."
  - "Notes' treedepth (K04 p. 132-135) returns 0 for the empty tree, i.e. counts levels, whereas the slides return -1 (count links); the chapter points out the difference."
  - "Chapter is ~645 lines, above the 350-550 target, mainly because of the three complete programs (depth, traversals, BFS) and the tables."
