issues:
  - "2026-27 deck (45 pages) vs 2025-26 (41 pages). New pages: p. 3 (1st place for an NKUA team at GRCPC 2026, plus a silver and three places in the top 11, with the scoreboard link), p. 28 (a Chekhov's Gun image, «every element in a story should earn its place», between the addnums question and scanf, with no text of its own; the chapter only lists it in the reading pages), pp. 42-43 (fprintf, stdout vs stderr, `fprintf(stderr, \"Not a prime number: %d\\n\", num)`; added to §9.3 and the glossary). Page mapping: 2025-26 pp. 1-2 = 2026-27 pp. 1-2; pp. 3-26 -> 4-27; pp. 27-39 -> 29-41; pp. 40-41 -> 44-45. Other changes: p. 2 fixes the spelling «Διευκρινίσεις»; pp. 7-8 add painting captions; p. 11 (old p. 10) replaces the hw0 2025 trolley stdin screenshot with the hw0 2026 goldbach one (ending in «EOF detected, exiting»), and §9.22 now uses goldbach and mentions trolley as the 2025-26 example. The outline and pointers above use 2026-27 pages; the issues below use 2025-26 page numbers."
  - "No explicit key-takeaways slide; p. 40 ('Για την επόμενη φορά') lists reading pointers only. Κύρια σημεία were built from the red callouts (p. 17 one char, p. 18-19 buffer/Ctrl+D, p. 24 int not char, p. 31 address, p. 34 check return value, p. 37 whitespace skipping, p. 29 'συμμετρική της printf')."
  - "p. 40 cites notes pages 28-29, 70-71, 78-79, 86-87; these are printed page numbers and match k04-map.tsv exactly (28-29, 70-71, 78-79, 86-87); the chapter cites the section names with these pages and quotes the slides' numbers."
  - "p. 3-4: the slides ask 'Υπάρχει κάποια εξήγηση;' but give no answer; the explanation (float rounding vs double constant) and the fix (fabs with tolerance, or 3.1f) are standard C, verified locally (a == 3.1 false, a == 3.1f true)."
  - "p. 24: the callout 'πάντα αναθέτουμε την τιμή επιστροφής της getchar() εκτός και αν είμαστε σίγουροι για το τι κάνουμε' is ambiguous; interpreted together with the other callout as 'always store it in an int'."
  - "p. 26 and p. 38: getinteger declares `int ch;` but keeps the comment 'No need to declare ch as int - no EOF handling', which only makes sense for the notes' version (`char ch;`, notes ch. 04). Transcribed as on the slide; the reformatted comment columns differ from the slide."
  - "p. 21: the charcount terminal output shows no blank line before 'Total characters: 24' although the program prints '\\n' before it (after the echoed newline); transcribed as on the slide."
  - "p. 35: the second run ('Gimme a number: Square: 1068701481') is interpreted as Ctrl+D (scanf returns EOF); the slide does not say what was typed."
  - "Ctrl+D behaviour with a non-empty line (needs a second Ctrl+D for EOF) and the unsigned-char infinite-loop case come from standard termios/C knowledge (p. 40 links canonical mode), not from the slides."
  - "p. 10: the 'trolley' program in the stdin screenshot is presumably a homework exercise; not identified, so the chapter only names it."
  - "Audience questions on p. 15 and p. 27 ('πως μπορώ να βρω πως συμπεριφέρεται;') are answered on the same slide (man getchar / man scanf); no question files were written for them."
  - "p. 39 is a code fragment without main (histogram from notes ch. 05); kept as a fragment."
  - "Running `tools/gen-exercises.py --help` accidentally ran the generator (it has no --help), which refreshed the generated exercise blocks in other chapters, questions/README.md and README.md."
