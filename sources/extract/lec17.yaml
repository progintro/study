  - "p. 17 / 36: the two binary-search-errors links (dl.acm.org DOI 10.1145/52964.53012 and the p190-pattis.pdf) were not opened; the chapter describes them generically as an article on textbook binary-search errors (file name suggests R. Pattis) without naming author or title. The YouTube video sBtAGxBh-XI was not opened; described only as 'βίντεο'."
  - "p. 35: quicksort still computes the pivot index as (lower + upper) / 2, the same overflow pattern fixed on p. 17; the chapter points this out."
  - "p. 34: quicksort code has a stray indented closing brace after the for loop; transcribed with normal indentation. All slide code (find, binary_search, swap, selection_sort, insertion_sort, bubblesort, merge_sort, merge, quicksort) was compiled and run on test arrays; traces in the chapter are real output."
  - "p. 29: the slide says merge sort has 'θεωρητικά την καλύτερη πολυπλοκότητα'; the chapter phrases it as O(n log n) even in the worst case, optimal for comparison sorting (standard fact, not stated on the slide)."
