issues:
  - "p. 2 (announcements: in 2026-27 hw0 is released after the lecture, submitted through hw.uoa.gr, deadline Wednesday 2026/11/04 23:59; list of useful shell commands, pipe and redirect) is course logistics / review of lecture 1; not turned into theory."
  - "p. 3 of the 2025-26 deck is a Kahoot review question from lecture 2 (volatile vs secondary memory); written as slides-lec03-power-outage with chapters [3, 2]. The 2026-27 deck replaced it with a painting, so that question still cites the 2025-26 deck."
  - "p. 5: the slide lists long int as 4 bytes and unsigned long int as 4 bytes. On 64-bit Linux (the lab machines) long is 8 bytes; the chapter keeps the slide table and adds the notes' wording («συνήθως 4, μερικές φορές 8»)."
  - "pp. 6-7: the memory diagram shows the int's value 42 in 'Byte 3' (big-endian style); the chapter gives the bit pattern without committing to a byte order (endianness is in chapter 12)."
  - "p. 8: the slide asks 'Τι συνέβη; Πώς το διορθώνουμε;' without an answer; the fix in the chapter (long long / LL / %lld, or unsigned) and the mention of a gcc overflow warning are standard C, not quoted from the lecture."
  - "p. 12: the table says %f prints float; the chapter adds that it prints double too (standard printf behaviour)."
  - "p. 20: the `file a.out` output line is long; it was re-wrapped in the chapter to stay under 80 columns."
  - "p. 43 (p. 42 in 2025-26): the linker path in the terminal screenshot is /usr/bin/X11/ld; transcribed as shown."
  - "p. 44 (p. 43 in 2025-26): the slide writes the formula as 4·Σ(-1)^i/(2i+1) = 1/1 - 1/3 + ..., which is inconsistent (the left side is π, the right side π/4). The chapter and the question write π/4 = Σ ... = 1/1 - 1/3 + ..."
  - "p. 45 (p. 44 in 2025-26): the pi program's main has no return statement; kept as on the slide (compiles, main implicitly returns 0 in C99+). The 2026-27 slide declares main(int argc, char ** argv) instead of main()."
  - "p. 46 (p. 45 in 2025-26) is only 'Kahoot Time!'; the quiz questions are not in the slides, so none were transcribed."
  - "p. 47 (p. 46 in 2025-26): 'μέχρι την σελίδα 35 + σελίδες 58-71' interpreted as K04 pages; per k04-map.tsv these are notes chapters 00-02 up to «Εντολές αντικατάστασης, τελεστές και παραστάσεις» and pp. 58-71 = 04-functions «Δομή ενός προγράμματος C – Συναρτήσεις» through «Μετατροπές μεταξύ δεκαδικών και δυαδικών αριθμών»."
  - "Lab mapping: lab02 pyth.c is the same exercise as Challenge #1; lab05 (collatz.c 1.1-1.2) is the first lab that asks for user-defined functions. The front-matter labs are [lab02, lab05] rather than the manifest's [lab05] alone."
  - "The outline maps pp. 40-48 (demo, challenges, Kahoot, reading, closing) to 'Pair programming' since the challenges are worked in «Παραδείγματα», not in a Θεωρία H3."
  - "p. 37: the 2026-27 slide says the call passes «τις παραμέτρους (ορίσματα)»; 2025-26 said «τα ορίσματά της». The chapter keeps the parameter (in the definition) vs argument (in the call) distinction."
