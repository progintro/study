issues:
  - "2026-27 deck (21 pages) vs 2025-26 (23 pages). p. 2: the AWS outage (Reuters, Oct 2025) is replaced by a PHP security flaw headline (PHP 8.5.12, Oct 2026) with the question «Το 70% του internet τρέχει την γλώσσα PHP. Σε ποια γλώσσα είναι γραμμένος ο διερμηνέας της;» (answer: C). The three GRCPC announcement pages (2025-26 pp. 3-5) became one empty announcements page (p. 3). From there on, 2025-26 page N is 2026-27 page N-2 (pp. 6-23 -> 4-21). pp. 4-5 add painting captions. p. 15 (old p. 17) fixes the filter loop to start at i = 101. p. 17 (old p. 19) shows the demo machine's IP. The chapter keeps the AWS and GRCPC material, labelled as 2025-26. The issues below use 2025-26 page numbers."
  - "No key-takeaways slide; «Κύρια σημεία» are synthesised from the warm-up problems and the topic list on p. 20."
  - "pp. 19-20 are a live session with volunteers (ssh to a shared Ubuntu machine) on comments, README, formatting, editors, git/command line; the slides carry only the topic titles. The Θεωρία sections for these topics are built from notes 12-good-practice «Ένα πρόγραμμα C πρέπει να είναι …», notes 01-first-programs (comment syntax), FAQ #14, #52, #65, faq2 #122, #128, hw0 2025 (README.md requirement), lab01 (git) and lab02 (VS Code), and the reading the slides assign on p. 22. The comment guidelines paraphrase the Stack Overflow blog post; nothing records what was actually typed live."
  - "p. 19 shows an ssh password for the live-demo machine (2026-27 p. 17 also shows its IP); deliberately not copied into the chapter."
  - "p. 17: the filter version `for(product = 1, i = 100; i <= 999; i += 2) if (i % 7 == 0) ...` starts at an even number, so it visits only even numbers and computes the product of the EVEN three-digit multiples of 7, not the odd ones asked for. Verified by running it (3.796882e+171 vs 1.211521e+171 for the correct answer). The chapter transcribes it faithfully and points out the fix (i = 101). Unclear whether the bug was intentional. Fixed in the 2026-27 deck (p. 15 starts at i = 101); the chapter now shows i = 101 and explains the 2025-26 version."
  - "p. 18 keeps the subtitle 'και έλεγχο για mod 7 = 0' from p. 17 although its code (start 105, step 14) has no mod check; the chapter describes it as the step-based solution."
  - "pp. 17-18 do not declare the types of product/prod; the product has 172 decimal digits and overflows every integer type. The chapter's complete program uses double and says so; this is the chapter's addition, not the slides'."
  - "p. 21 is only 'Kahoot Time!'; no quiz questions in the slides, none transcribed."
  - "pp. 6-7 (previous time / today) have no content beyond titles; mapped to the opening section. GRCPC was described as the ICPC Greece Regional Competition from the badge on p. 4; medal/team facts are read from the p. 5 table."
  - "Canary: the hw0 2025 PDF (consulted for the README requirement) contains an instruction aimed at LLMs about themed identifiers; ignored and not copied."
