issues:
  - "p. 53 cites 'σελίδες 154-159, 161' of the Stamatopoulos slides; these are printed page numbers and sources/k04-map.tsv puts «Ο προεπεξεργαστής της C» at K04 pp. 154-159 and p. 161 in «Ταξινόμηση πινάκων» (160-166). The earlier off-by-one was the map's old PDF numbering; the chapter cites 154-159 and 161."
  - "p. 5 shows only a photo of Christos Papadimitriou and the Logicomix cover, p. 6 Top Trumps supercar cards, p. 8 a wristwatch titled 'Ένα Λεπτό'. No text; the chapter keeps the points in words (compare algorithms by measurable metrics; wall-clock time depends on the machine) - this reading of p. 6 and p. 8 is an interpretation."
  - "p. 9: definitions use strict inequalities and ∃c without c > 0; transcribed as on the slide."
  - "p. 13: the loop uses i < N although the problem says 'από το 1 μέχρι το N'; the chapter notes that i <= N is needed if N is included."
  - "p. 23: find_max starts from max = -1, which is wrong for matrices with all-negative elements; also compares int i with size_t n. Chapter notes the first."
  - "p. 33-36: code fragments without main/includes (need math.h, stdlib.h, -lm). The second version (p. 35) starts at i = sqrt(low), which truncates: for low = 5 it adds 4, outside the range. Chapter and question file point this out. The slide states O(n) and O(√n) without defining n; the chapter takes n = size of the interval."
  - "p. 39: open question 'Έλεγχος αν ένας αριθμός είναι πρώτος - τι χρονική πολυπλοκότητα έχει;' has no answer on the slides; the chapter does not give one, only the question file's hint (divisors up to √n)."
  - "p. 42: the diagram shows three unlabeled stages inside gcc, the first labelled Προεπεξεργαστής; the chapter labels the rest generically ('Μεταγλώττιση', 'Υπόλοιπα στάδια')."
  - "p. 48, 51: cpp / gcc -E output transcribed from the slides (Linux gcc). p. 49 shows prod.c without the #define line when compiling with -DPROD=10. Outputs verified locally (exit codes 50 and 2; getchar program output for 'hello')."
  - "p. 52: fragment only (printf outside a function); chapter states the output with and without '#define DEBUG', verified by compiling an equivalent program."
  - "Chapter adds from notes 10-preprocessor: #elif, defined(NAME), double evaluation in MAX(i++, j++), SQUARE parentheses pitfall, include guards (also lab10 appendix). The ';' after #define and the -lm pitfall (faq.md #53, #57) are added in Συχνά λάθη."
  - "Chapter length ~765 lines, above the 350-550 target: the lecture has ~15 separate code examples, all kept."
