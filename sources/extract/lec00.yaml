changes_from_2025:
  - "New slides: p. 12 (AI in homework: no, honor code), p. 18 (student Discord), p. 19 (DIT Coding Club), p. 25 (algorithm vs program, Al-Khwarizmi), p. 30 ('Αμφισημίες Παντού': Pythia's oracle, an AI agent hacking Hugging Face for a test's answers)."
  - "p. 10 grading: 50% Γραπτές Εξετάσεις + 20% Εργαστήριο + 15% Ασκήσεις + 15% Προφορικές (first-years), else 70/15/15; a Πρόοδος on 7 December with Γραπτές = max(Τελική, 0.7 Τελική + 0.3 Πρόοδος); the adjustment now caps Ασκήσεις at Γραπτές + 3; Ασκήσεις submitted online; oral exams with theory questions and live coding."
  - "p. 4: the QS 'most improved in Europe' claim was replaced by 'distinctions in multiple fields'. p. 13: labs start the week of 5 October. p. 14: bringing a computer is optional. p. 17: check the FAQ as well as Piazza. p. 37: Sea online compiler added."
  - "Kahoot moved before 'Για την επόμενη φορά' (p. 39 and p. 40)."
issues:
  - "No explicit key-takeaways slide; p. 40 ('Για την επόμενη φορά') is the closest summary."
  - "p. 14 links the course form (forms.gle) and pp. 8, 18, 37 show QR codes; the form link is recorded here but left out of the chapter (it is a per-year sign-up form)."
  - "p. 16 is a bare 'Denial of Service Attacks' diagram right after 'Browsing Time' (p. 15); not course content."
  - "p. 17 poses 'Έχω μια ερώτηση - τι κάνω;' with options A and B without marking an answer; the chapter presents B as the course's channel."
  - "p. 21 (course roadmap) is unchanged from 2025 and lists lectures from an older syllabus; the chapter only uses the five part names and hw0/hw1/hw2/project."
  - "p. 30 is two images without text; the chapter explains the Pythia oracle (comma placement) and describes the AI comic as ambiguity in an instruction that does not say how a task may be solved."
  - "p. 12: the infographic's study is cited from its footer ('Based on Gao, Sun & Khan (2026), Frontiers in Psychology'); not independently checked."
  - "The compile/link process, the computer structure and bits/bytes come from notes 00-intro (assigned reading up to K04 p. 19), not from the slides."
  - "p. 39 is 'Kahoot!' without questions; the Kahoot block still reports 2025-26 results."
