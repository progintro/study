issues:
  - "p. 2: announcements (make-up lecture Thu 27 Nov 6-8pm; oral exams for Εργασία #0 starting next week) are course logistics and were left out of the chapter."
  - "p. 45: 'σελίδες 63-68, 74-76, 93-96' of Stamatopoulos's slides. Per k04-map.tsv (printed pages) these are exactly 04-functions «Εμβέλεια και χρόνος ζωής μεταβλητών» 63-68, part of 05-pointers-arrays «Δείκτες» (72-77) and 06-memory-strings «Συμβολοσειρές» 93-96. The chapter cites «Εμβέλεια και χρόνος ζωής μεταβλητών» 63-68, «Συμβολοσειρές» 93-96 and «Δείκτες» 74-76 (the slides' pages)."
  - "p. 28: the second declaration is partly hidden behind the 'null byte' callout; reconstructed as {72, 101, 108, 108, 111, 32, 87, 111, 114, 108, 100, 10, 0}, consistent with chapter 10."
  - "p. 29-32: printf uses %d for strlen's size_t result; the chapter uses %zu and lists %d as a common mistake."
  - "p. 22: tmp[1] = 255 into a plain (usually signed) char is implementation-defined (-1 on x86); the slide's diagram shows 255 and the chapter keeps it. The malloc'd block is never freed (memory leak); the chapter points it out. The stack addresses (31998-32000) and global bytes 1-3 are illustrative."
  - "p. 24: the nm output for global_buffer[100000000] shows counter.0 at 0x17d78400 (= 400,000,000) and du 4.0K; transcribed in prose, not as a separate block."
  - "p. 35: the slide defines the return as 'θετική αν A > B (αρνητική αν B > A)'. The exact values (4, -4, -1, 114) are the byte differences glibc returned; the C standard guarantees only the sign. The chapter says so."
  - "p. 26-27: the slides say only that literals are stored in static memory; the statement that literals must not be modified comes from notes 06-memory-strings «Συμβολοσειρές»."
  - "Additions from the notes, not on the slides: uninitialised globals are 0 and locals indeterminate; static on a global limits it to the file; the drawbacks of globals. -Wshadow and the strncpy null-termination caveat are standard gcc/libc facts added for context."
  - "p. 29-32 (strlen of 'hello world' = 11) and p. 35 (strcmp runs) are revealed step by step like audience questions, but not phrased as questions; no question files for them."
  - "p. 42 ('--boo') has no answer on the slides; the chapter gives none and the question file gives only a hint."
