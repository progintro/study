issues:
  - "p. 2: announcements (Εργασία #0 finished; Εργασία #1 deadline Wednesday 10 December 23:59; 'Συζήτηση'; γρίφοι & bonus) are course policy and were not put in the chapter."
  - "No slide cites K04 / notes pages or labs; the Διάβασμα notes sections (06-memory-strings «Δυναμική δέσμευση μνήμης», «Πολυδιάστατοι πίνακες»; 04-functions «Εμβέλεια και χρόνος ζωής μεταβλητών») and lab07 (array.c, mines.c, my_prog.c) were chosen from the course material."
  - "p. 5-7 (endianness example) and p. 37-38 (how much memory malloc allocates / sizeof of the pointers prints 8 8 8) repeat lecture 12 slides 41-43 and 39-40. The questions already exist as slides-lec12-endianness and slides-lec12-malloc-sizeof, so no duplicate lec13 question files were written; consider adding lecture 13 to their source/Εμφανίσεις."
  - "p. 9: global/static memory is marked 'όχι σήμερα'; the chapter describes it in one sentence from the notes (04-functions) and links chapter 14 as a guess for where it is covered."
  - "p. 17-26: CompTmp1..CompTmp5 are schematic names for compiler temporaries; the chapter says so. The slides' own tolower clashes with the libc builtin (gcc/clang warn 'incompatible redeclaration'); the chapter mentions the warning."
  - "p. 37: slide prints sizeof with %d; the chapter does not repeat that code (covered in chapter 12 with %zu)."
  - "p. 44: the literal 900000000000L is 9e11 bytes (900 GB); that the program still prints Hello World relies on malloc returning NULL for an impossible request (behaviour with Linux overcommit may vary); transcribed as shown."
  - "p. 46, 56: fprintf(stderr, ...)/exit(1) without free(bomb); the chapter's version adds free(bomb) and says so."
  - "p. 52-55: the slides assign realloc's result straight back to array; the chapter adds (in Συχνά λάθη) that on failure the old block leaks, which is standard C behaviour but not stated in the slides."
  - "p. 61-63: quiz screenshots with the question 'Θέλω να δημιουργήσω έναν πίνακα 5x5 - αυτή η υλοποίηση είναι:'; the answer options area is blank/cut off, so the options could not be transcribed. On p. 61 the malloc line is cut off at the right edge ('malloc(5 * sizeof(int*)'); the question file closes it as 'malloc(5 * sizeof(int*));'."
  - "p. 61-64 come after the closing 'Ευχαριστώ' slide (p. 60): appendix slides (quiz, perror variant of the 2D allocation)."
  - "Chapter length is ~700 lines (above the 350-550 target) because the lecture has 64 slides with many programs; comparable to other chapters (e.g. 05, 10)."
