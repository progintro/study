issues:
  - "No explicit key-takeaways slide; p. 34 ('Για την Επόμενη Φορά') is a reading list. Takeaways were derived from the definitions and the red callout on p. 8 ('μνήμη' = κύρια μνήμη)."
  - "pp. 1-4 are title, announcements (lab starts this week, no office hours; WSL 2 installation question) and agenda; not course content, mapped to the first theory section. The agenda on p. 4 lists 'Συνέχεια του Hello World', 'Συναρτήσεις και Ακέραιοι (Μαθηματικά vs C)' and 'Pair Programming', which have no slides in this deck; not covered in the chapter."
  - "p. 33 is only 'Kahoot Time!' (quiz not in the slides) and p. 35 a closing slide; both mapped to the last section."
  - "p. 6 uses decimal units (1 KB = 1.000 bytes) while notes 00-intro use powers of 2 (1 KB = 1024); the chapter gives both."
  - "pp. 6-7, 14-15, 24-25: the memory diagram labels bytes 'Byte 0' ... 'Byte N' for a memory 'με N Bytes' (off by one); the chapter says addresses 0 to N-1."
  - "p. 23: the types table gives long int and unsigned long int as 4 bytes; true on Windows/32-bit, but 8 bytes on 64-bit Linux (the lab machines). The chapter keeps the slide values and adds a note. char range -128..127 assumes signed char (implementation-defined)."
  - "pp. 24-25: the 'after' diagram puts 00101010 in Byte 3 (big-endian depiction); the chapter notes that x86 is little endian and points to chapter 12."
  - "p. 26: signed integer overflow is undefined behavior in C; the chapter says so, while presenting the wrap-around output shown in the slide. The gcc warning text quoted (-Woverflow) was written from knowledge of gcc, not verified locally (local gcc is clang, which prints a -Winteger-overflow warning)."
  - "p. 16 poses the question without the answer; 'man' is inferred from p. 17 (man ascii)."
  - "Answers to audience questions (p. 5, 10, 17, 18) are not in the slides; the chapter's answers are standard facts."
  - "The 'Τύποι και printf σε ένα πρόγραμμα' example is not in the slides; it combines the slide tables and its output was verified locally. Ariane 5 / Y2K / 2038 explanations are standard facts; the slides only link them."
  - "The chapter body is ~690 lines (plus the generated exercises list), above the 350-550 target; kept to cover every slide table (types, escape sequences, format specifiers, keywords)."
