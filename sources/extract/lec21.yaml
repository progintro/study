issues:
  - "Link texts on p. 64 were matched to URLs from pdftohtml -xml by order; the mapping is unambiguous but not verified online."
  - "p. 2: announcements (joint lecture on Mon 15/12 in A2; Εργασία #2 coming) are course logistics and were only alluded to in the chapter (Σύνοψη mentions Εργασία #2)."
  - "p. 17, 40, 52, 58: title-only build slides (blank bodies) preceding the code reveals; no content lost."
  - "p. 22: find prints pointers with %x (gcc -Wall warns, truncates to 32 bits on 64-bit); output '161862c0' transcribed as on the slide; the chapter recommends %p. The find program on p. 21 uses insert without defining it (defined on p. 13); the chapter marks that block with '....'."
  - "p. 28-29: slides define depth (root to leaves) and height (leaves to root) of the whole tree, both 2; they do not distinguish per-node depth/height. Level (p. 31) counts nodes, root = level 1."
  - "p. 42, 50, 53, 59: complexities O(logn) for space (and time in BST exists) assume a perfect/balanced tree (p. 42 says so explicitly for depth); the chapter adds that a degenerate tree gives O(n)."
  - "p. 55-56: pop_last is used but never defined, and List would need to hold Tree instead of int (the slide asks this as a question). The chapter gives a pop_last and the changed node type; the full program was compiled and printed '5 7 1 2 9' (BFS order of 5 (7 (2, 9), 1)), which the slides do not show."
  - "p. 55 names the list 'worklist', p. 56 'frontier'; same code."
  - "p. 60-63: questions (DFS vs BFS, 1 PB storage, maze shortest path, max element) are left open on the slides; the chapter's «DFS ή BFS;» section answers the maze/max ones in line with faq2.md #119-120."
  - "p. 37: the N-ary tree example is a tic-tac-toe game tree image with scores +10/0/-10; described in words only."
  - "p. 38: insert/delete for trees are 'μόνοι σας' (exercise); question slides-lec21-tree-insert-delete; the hint points to BST insertion as in lab09 tree.c addtree."
  - "Chapter length is ~790 lines, above the 350-550 target, because the lecture has 65 slides with many complete programs (all kept)."
