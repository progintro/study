  - {n: 9,  slug: 09-input,              date: 2025-10-31, part: B, slides: lec09.pdf, title: "Δεδομένα Εισόδου",                    notes: [01-first-programs, 09-io],    labs: [lab04]}
  - {n: 10, slug: 10-arrays,             date: 2025-11-03, part: C, slides: lec10.pdf, title: "Πίνακες",                             notes: [05-pointers-arrays],          labs: [lab06]}
  - {n: 11, slug: 11-pointers-recursion, date: 2025-11-07, part: C, slides: lec11.pdf, title: "Δείκτες και Αναδρομή",                notes: [04-functions, 05-pointers-arrays], labs: [lab05, lab06]}
  - {n: 12, slug: 12-pointers-arrays,    date: 2025-11-10, part: C, slides: lec12.pdf, title: "Δείκτες και Πίνακες",                 notes: [05-pointers-arrays],          labs: [lab06]}
  - {n: 13, slug: 13-memory,             date: 2025-11-14, part: C, slides: lec13.pdf, title: "Μνήμη",                               notes: [06-memory-strings],           labs: [lab07]}
  - {n: 14, slug: 14-scope-strings,      date: 2025-11-21, part: C, slides: lec14.pdf, title: "Εμβέλεια, Μνήμη και Συμβολοσειρές",   notes: [04-functions, 06-memory-strings], labs: [lab08]}
  - {n: 15, slug: 15-complexity-preprocessor, date: 2025-11-24, part: C, slides: lec15.pdf, title: "Πολυπλοκότητα και Προεπεξεργαστής", notes: [10-preprocessor, 11-sorting-searching], labs: []}
