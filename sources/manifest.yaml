# One entry per chapter of the study guide: the 2025-26 lectures (release tag 2025
# of progintro/progintro.github.io) plus the guest lecture on make as an appendix.
#
#   slides   file name in the release; `make fetch` downloads it to sources/slides/
#   notes    progintro/notes chapters that cover the same ground (starting guess,
#            refined by the extraction pass - the chapter's front matter is canonical)
#   labs     progintro/lab-material labs that practise it (same caveat)
#   part     the book part the chapter opens or belongs to (see `parts` below)
release: https://github.com/progintro/progintro.github.io/releases/download/2025
year: 2025-26

parts:
  A: Εργαλεία και πρώτα βήματα
  B: Τα θεμέλια της C
  C: Πίνακες, δείκτες και μνήμη
  D: Αλγόριθμοι και δομές δεδομένων
  E: Οργάνωση κώδικα και προχωρημένα θέματα
  X: Παραρτήματα

lectures:
  - {n: 0,  slug: 00-hello-world,        date: 2025-09-29, part: A, slides: lec00.pdf, title: "Καλημέρα Κόσμε!",                     notes: [00-intro, 01-first-programs], labs: [lab00]}
  - {n: 1,  slug: 01-command-line,       date: 2025-10-03, part: A, slides: lec01.pdf, title: "Η Γραμμή Εντολών",                    notes: [00-intro],                    labs: [lab01]}
  - {n: 2,  slug: 02-memory-variables,   date: 2025-10-06, part: B, slides: lec02.pdf, title: "Μνήμη και Μεταβλητές",                notes: [02-types-operators],          labs: [lab02, lab03]}
  - {n: 3,  slug: 03-functions,          date: 2025-10-10, part: B, slides: lec03.pdf, title: "Συναρτήσεις",                         notes: [04-functions],                labs: [lab05]}
  - {n: 4,  slug: 04-git-operators,      date: 2025-10-13, part: A, slides: lec04.pdf, title: "Git και Τελεστές",                    notes: [02-types-operators],          labs: [lab01]}
  - {n: 5,  slug: 05-operators-statements, date: 2025-10-17, part: B, slides: lec05.pdf, title: "Τελεστές και Εντολές",              notes: [02-types-operators, 03-control-flow], labs: [lab03]}
  - {n: 6,  slug: 06-control-flow,       date: 2025-10-20, part: B, slides: lec06.pdf, title: "Εντολές και Ροή Ελέγχου",             notes: [03-control-flow],             labs: [lab03]}
  - {n: 7,  slug: 07-problem-solving,    date: 2025-10-24, part: B, slides: lec07.pdf, title: "Επίλυση Προβλημάτων",                 notes: [01-first-programs],           labs: [lab03]}
