  - {n: 23, slug: 23-code-organization,  date: 2025-12-19, part: E, slides: lec23.pdf, title: "Οργάνωση Κώδικα",                     notes: [10-preprocessor, 12-good-practice], labs: [lab10]}
  - {n: 24, slug: 24-advanced-topics,    date: 2025-12-22, part: E, slides: lec24.pdf, title: "Προχωρημένα Θέματα",                  notes: [12-good-practice],            labs: []}
  - {n: 25, slug: 25-problem-solving-3,  date: 2026-01-09, part: E, slides: lec25.pdf, title: "Επίλυση Προβλημάτων #3",              notes: [],                            labs: []}
  - {n: 26, slug: 26-make,               date: 2025-12-19, part: X, slides: make.pdf,  title: "How to Make? (προσκεκλημένη διάλεξη)", notes: [],                          labs: [lab10], appendix: true}

