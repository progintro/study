# Build the study guide in every format and publish it to
# https://progintro.github.io/study/.
#
#   HTML      Jekyll (the same action classic Pages uses), from chapters/ and questions/
#   PDF       make: one per chapter plus the whole book, via pandoc + xelatex
#   Markdown  make: study-md.zip; each chapter at /md/<slug>.md; /llms.txt and
#             /llms-full.txt (the whole guide in one file) for agents
#   JSON      make: /downloads/questions.json, the question bank
#
# These are build outputs and are not committed, which is why this site deploys from
# a workflow rather than straight from the branch. Pull requests run everything
# except the deploy.
name: Build and publish the study guide

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -c 'import yaml' || pip install pyyaml

      - name: Lint chapters and questions
        run: make lint

      - name: Compile every program in the chapters
        run: python3 tools/check-code.py

      - name: Check the generated exercise lists are up to date
        run: python3 tools/gen-exercises.py --check

      # Serial on purpose: parallel pandoc containers have produced truncated PDFs.
      - name: Build PDFs, Markdown and JSON
        run: make

      # A pandoc/xelatex failure can still leave a stub PDF behind.
      - name: Check PDFs
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          for f in build/*.pdf; do
            pages=$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')
            echo "$f: $pages pages"
            [ "${pages:-0}" -gt 1 ] || { echo "::error::$f has ${pages:-0} page(s)"; exit 1; }
          done

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # kramdown needs $$x$$ for inline math; the committed Markdown keeps $x$ for
      # GitHub and pandoc. See tools/site-prep.py.
      - name: Prepare Markdown for kramdown
        run: python3 tools/site-prep.py

      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Add downloads and check the site
        run: |
          sudo chown -R "$(id -u)" _site
          mkdir -p _site/downloads
          cp build/*.pdf build/study-md.zip build/questions.json _site/downloads/
          cp build/llms.txt build/llms-full.txt _site/
          mkdir -p _site/md
          for d in chapters/*/; do
            slug=$(basename "$d")
            test -f "_site/${d}index.html" || { echo "::error::missing _site/${d}index.html"; exit 1; }
            # the committed Markdown, not the kramdown-prepared copy in the tree
            git show "HEAD:${d}README.md" > "_site/md/${slug}.md"
          done
          test -f _site/questions/index.html || { echo "::error::missing _site/questions/index.html"; exit 1; }
          ls -la _site _site/downloads _site/md

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
